[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-harness"
version = "0.1.0"
description = "A dependency-light, evaluation-friendly enterprise multi-agent harness prototype."
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
rag = ["sentence-transformers>=3.0"]

[project.scripts]
enterprise-agent = "enterprise_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enterprise_agent = [
  "suites/**/*.json",
  "suites/**/*.jsonl",
  "corpora/**/*.json",
  "corpus_manifests/**/*.json",
  "retrieval_suites/**/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
